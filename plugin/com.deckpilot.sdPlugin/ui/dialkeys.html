<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
	<sdpi-item label="Label">
		<sdpi-textfield setting="label" placeholder="Mode"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Target app">
		<sdpi-textfield setting="app" placeholder="Terminal / iTerm / Ghostty / ptygrid (empty = frontmost)"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Rotate left">
		<sdpi-textfield setting="left" placeholder="{up}"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Rotate right">
		<sdpi-textfield setting="right" placeholder="{down}"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Push / tap">
		<sdpi-textfield setting="push" placeholder="{enter}"></sdpi-textfield>
	</sdpi-item>
</body>
</html>
